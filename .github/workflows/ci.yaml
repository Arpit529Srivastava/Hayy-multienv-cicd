name: Build and Test

on:
  push:
    branches:
      - dev
      - stag
      - prod
  pull_request:
    branches:
      - dev
      - stag
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

