name: Deploy to Staging

on:
  push:
    branches:
      - stag

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging-Docker
        run: |
          docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.GH_PAT }} ghcr.io
          docker build -f app/Dockerfile.staging -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/hayy-ai-backend-stag:staging ./app
          docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/hayy-ai-backend-stag:staging