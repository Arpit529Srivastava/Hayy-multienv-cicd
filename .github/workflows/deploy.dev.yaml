name: Deploy to Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Dev-Docker
        run: |
          docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.GH_PAT }} ghcr.io
          docker build -f app/Dockerfile -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/hayy-ai-backend:latest .
          docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/hayy-ai-backend:latest