apiVersion: apps/v1
kind: Deployment
metadata:
  name: hayy-api-prod
  namespace: hayy-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hayy-api-prod
  template:
    metadata:
      labels:
        app: hayy-api-prod
    spec:
      containers:
      - name: api
        image: ghcr.io/arpit529srivastava/hayy-ai-backend-prod:production-v2
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60    #  Increased from 30
          periodSeconds: 30           # ⬅️ CHANGED: Increased from 10
          timeoutSeconds: 10          #  Added: New timeout
          failureThreshold: 3         #  Added: Allow 3 failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30     #  Increased from 5
          periodSeconds: 15           #  Increased from 5
          timeoutSeconds: 10          #  Added: New timeout
          failureThreshold: 3         #  Added: Allow 3 failures
        env:
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: hayy-api-prod-secrets
              key: NODE_ENV
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: hayy-api-prod-secrets
              key: PORT
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: hayy-api-prod-secrets
              key: MONGODB_URI
        - name: RATE_LIMIT_MAX       #  Added: Increase rate limit
          value: "1000"
      nodeSelector:
        eks.amazonaws.com/compute-type: fargate
      tolerations:
      - key: eks.amazonaws.com/compute-type
        operator: Equal
        value: fargate
        effect: NoSchedule