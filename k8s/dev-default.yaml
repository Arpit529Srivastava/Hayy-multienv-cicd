apiVersion: apps/v1
kind: Deployment
metadata:
  name: hayy-api-dev
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hayy-api-dev
  template:
    metadata:
      labels:
        app: hayy-api-dev
    spec:
      containers:
      - name: api
        image: ghcr.io/arpit529srivastava/hayy-ai-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: hayy-api-dev-secrets
              key: NODE_ENV
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: hayy-api-dev-secrets
              key: PORT
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: hayy-api-dev-secrets
              key: MONGODB_URI
      nodeSelector:
        eks.amazonaws.com/compute-type: fargate
      tolerations:
      - key: eks.amazonaws.com/compute-type
        operator: Equal
        value: fargate
        effect: NoSchedule